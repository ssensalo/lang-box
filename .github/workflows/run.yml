name: update gist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Linguist dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libicu-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Show Ruby environment
        run: |
          ruby --version
          gem --version
          which ruby
          gcc --version
          g++ --version

      - name: Install GitHub Linguist
        run: gem install github-linguist --no-document

      - run: npm ci

      - run: npm start
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: d7b8e9b9a05981c2bc9b9f06785a7708
          USERNAME: ${{ github.actor }}
